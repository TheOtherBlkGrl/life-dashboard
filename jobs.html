<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Jobs - Clarissa's Dashboard</title>
<link rel="stylesheet" href="style.css?v=13">
<script src="js/astronomy.browser.min.js"></script>
</head>
<body data-page="jobs">
<div id="lock" class="lock-screen">
  <div class="lock-card">
    <h1>Clarissa's Dashboard</h1>
    <p class="lock-sub">Enter your 6-digit PIN</p>
    <input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;">
    <button id="unlock-btn" onclick="unlock()">Unlock</button>
    <p id="lock-error" class="lock-error"></p>
  </div>
</div>
<main id="app" class="hidden">
  <header class="top">
    <div>
      <h1 id="greeting">Dashboard</h1>
      <p id="today" class="date-line"></p>
    </div>
    <button class="ghost" onclick="lockSite()">Lock</button>
  </header>
  <nav class="nav">
    <a href="index.html">Home</a><a href="jobs.html" class="active">Jobs</a><a href="journal.html">Journal</a><a href="calendar.html">Calendar</a>
  </nav>

  <div class="banner-wrap wide">
    <article class="card">
      <h2>Job Applications</h2>
      <div id="job-stats" class="stat-row"></div>
      <div id="jobs"></div>
    </article>
  </div>
  <section class="grid">
    <article class="card span2">
      <h2>Important Emails</h2>
      <div id="emails"></div>
    </article>
  </section>
</main>
<script src="data/public.js"></script>
<script src="app.js?v=13"></script>
</body>
</html>
