<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Journal - Clarissa's Dashboard</title>
<link rel="stylesheet" href="style.css?v=16">
<script src="js/astronomy.browser.min.js"></script>
</head>
<body data-page="journal">
<div id="lock" class="lock-screen">
  <div class="lock-card">
    <h1>Clarissa's Dashboard</h1>
    <p class="lock-sub">Enter your 6-digit PIN</p>
    <input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;">
    <button id="unlock-btn" onclick="unlock()">Unlock</button>
    <p id="lock-error" class="lock-error"></p>
  </div>
</div>
<main id="app" class="hidden">
  <header class="top">
    <div>
      <h1 id="greeting">Dashboard</h1>
      <p id="today" class="date-line"></p>
    </div>
    <button class="ghost" onclick="lockSite()">Lock</button>
  </header>
  <nav class="menu-wrap">
    <button id="menu-btn" class="hamburger" aria-label="Menu" onclick="toggleMenu()"><span></span><span></span><span></span></button>
    <div id="menu" class="menu">
      <a href="index.html">Home</a>
      <a href="jobs.html">Jobs</a>
      <a href="journal.html">Journal</a>
      <a href="analytics.html">Analytics</a>
      <a href="calendar.html">Calendar</a>
    </div>
  </nav>

  <div class="banner-wrap wide">
    <article class="card banner">
      <h2>Horoscope</h2>
      <p id="horoscope" class="horoscope"></p>
    </article>
  </div>
  <div class="banner-wrap wide">
    <article class="card">
      <h2>Journal</h2>
      <p class="prompt-line"><span class="plabel">Today's prompt</span><span id="prompt"></span></p>
      <div id="journal" style="margin-top:12px"></div>
    </article>
  </div>
</main>
<script src="data/public.js"></script>
<script src="app.js?v=16"></script>
</body>
</html>
